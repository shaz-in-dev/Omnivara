apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnivara-ai
  namespace: omnivara
  labels:
    app: omnivara-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnivara-ai
  template:
    metadata:
      labels:
        app: omnivara-ai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai
          image: ghcr.io/omnivara/ai:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: omnivara-config
            - secretRef:
                name: omnivara-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: omnivara-ai
  namespace: omnivara
  labels:
    app: omnivara-ai
spec:
  selector:
    app: omnivara-ai
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
