# DO NOT commit real secrets. Use External Secrets Operator or Sealed Secrets in prod.
# This is a template — values are base64-encoded placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: omnivara-secrets
  namespace: omnivara
type: Opaque
data:
  # echo -n "value" | base64
  DATABASE_URL: "<base64-encoded>"
  JWT_SECRET: "<base64-encoded>"
  JWT_REFRESH_SECRET: "<base64-encoded>"
  ANTHROPIC_API_KEY: "<base64-encoded>"
  REDIS_PASSWORD: "<base64-encoded>"
  MINIO_ACCESS_KEY: "<base64-encoded>"
  MINIO_SECRET_KEY: "<base64-encoded>"
  SMTP_USER: "<base64-encoded>"
  SMTP_PASS: "<base64-encoded>"
  STRIPE_SECRET_KEY: "<base64-encoded>"
