apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnivara-web
  namespace: omnivara
  labels:
    app: omnivara-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omnivara-web
  template:
    metadata:
      labels:
        app: omnivara-web
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: ghcr.io/omnivara/web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.omnivara.io"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://api.omnivara.io"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: omnivara-web
  namespace: omnivara
  labels:
    app: omnivara-web
spec:
  selector:
    app: omnivara-web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
