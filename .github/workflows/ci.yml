name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # 1. Lint & Type Check
  # ----------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check

  # ----------------------------------------------------------------
  # 2. Unit Tests (web + api + packages)
  # ----------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter='./packages/*'
      - run: pnpm test --filter='!./apps/mobile' --filter='!./apps/desktop'

  # ----------------------------------------------------------------
  # 3. Build Check
  # ----------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter='!./apps/mobile' --filter='!./apps/desktop'

  # ----------------------------------------------------------------
  # 4. Python AI service lint + tests
  # ----------------------------------------------------------------
  ai-lint:
    name: AI Service (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff pytest pytest-asyncio pytest-mock httpx fastapi pydantic pydantic-settings anthropic openai
      - name: Lint
        run: ruff check services/ai/
      - name: Unit tests
        run: pytest services/ai/tests/ -v --tb=short
        env:
          ENVIRONMENT: test

  # ----------------------------------------------------------------
  # 5. Integration tests (API + real Postgres + Redis)
  # ----------------------------------------------------------------
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: omnivara_test
          POSTGRES_USER: omnivara
          POSTGRES_PASSWORD: omnivara
        options: >-
          --health-cmd "pg_isready -U omnivara -d omnivara_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter='./packages/*'
      - name: Generate Prisma client
        working-directory: services/api
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://omnivara:omnivara@localhost:5432/omnivara_test
      - name: Run Prisma migrations
        working-directory: services/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://omnivara:omnivara@localhost:5432/omnivara_test
      - name: Run integration tests
        working-directory: services/api
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://omnivara:omnivara@localhost:5432/omnivara_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-at-least-32-chars-long
          NODE_ENV: test

  # ----------------------------------------------------------------
  # 6. E2E tests (Playwright — auth, CRM, invoices, billing)
  # ----------------------------------------------------------------
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: omnivara_e2e
          POSTGRES_USER: omnivara
          POSTGRES_PASSWORD: omnivara
        options: >-
          --health-cmd "pg_isready -U omnivara -d omnivara_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter='./packages/*'
      - name: Migrate and seed E2E database
        working-directory: services/api
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed
        env:
          DATABASE_URL: postgresql://omnivara:omnivara@localhost:5432/omnivara_e2e
      - name: Build and start API
        working-directory: services/api
        run: |
          pnpm build
          nohup node dist/main.js &
          sleep 8
        env:
          DATABASE_URL: postgresql://omnivara:omnivara@localhost:5432/omnivara_e2e
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: e2e-test-secret-at-least-32-chars-long
          NODE_ENV: production
          PORT: 4000
      - name: Build and start web app
        working-directory: apps/web
        run: |
          NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1 pnpm build
          nohup pnpm start &
          sleep 5
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: apps/web
        run: npx playwright test --reporter=github
        env:
          E2E_EMAIL: admin@acme.com
          E2E_PASSWORD: Password123!
          BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
