name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: omnivara-staging
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: services/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-staging.omnivara.io

      - name: Build and push AI image
        uses: docker/build-push-action@v5
        with:
          context: services/ai
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ai:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EKS Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: https://app-staging.omnivara.io
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Deploy API
        run: |
          kubectl set image deployment/omnivara-api \
            api=${{ env.IMAGE_PREFIX }}/api:${{ needs.build-and-push.outputs.image-tag }} \
            -n omnivara
          kubectl rollout status deployment/omnivara-api -n omnivara --timeout=300s

      - name: Deploy Web
        run: |
          kubectl set image deployment/omnivara-web \
            web=${{ env.IMAGE_PREFIX }}/web:${{ needs.build-and-push.outputs.image-tag }} \
            -n omnivara
          kubectl rollout status deployment/omnivara-web -n omnivara --timeout=300s

      - name: Deploy AI Service
        run: |
          kubectl set image deployment/omnivara-ai \
            ai=${{ env.IMAGE_PREFIX }}/ai:${{ needs.build-and-push.outputs.image-tag }} \
            -n omnivara
          kubectl rollout status deployment/omnivara-ai -n omnivara --timeout=300s

      - name: Run smoke tests
        run: |
          sleep 15
          curl -f https://api-staging.omnivara.io/health || exit 1
          echo "✅ Smoke test passed"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Staging deployment failed. Check [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).'
            })
