version: "3.9"

# Omnivara One — Local Development Infrastructure
# Run: pnpm docker:up

name: omnivara

services:
  # ============================================================
  # PostgreSQL — primary transactional database
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omnivara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnivara_dev
      POSTGRES_USER: omnivara
      POSTGRES_PASSWORD: omnivara
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnivara -d omnivara_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis — cache, rate limiting, sessions
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: omnivara-redis
    restart: unless-stopped
    command: redis-server --requirepass "" --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Zookeeper — required by Kafka
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: omnivara-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  # ============================================================
  # Kafka — event streaming backbone
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: omnivara-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================
  # MinIO — S3-compatible object storage
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: omnivara-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # MailHog — local SMTP for email testing
  # ============================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: omnivara-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

  # ============================================================
  # ClickHouse — event analytics and aggregations
  # ============================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: omnivara-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP
      - "9009:9009"   # Native
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ============================================================
  # OpenSearch — full-text search and retrieval
  # ============================================================
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: omnivara-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1

  # ============================================================
  # Temporal — workflow orchestration
  # ============================================================
  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: omnivara-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7233:7233"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: omnivara
      POSTGRES_PWD: omnivara
      POSTGRES_SEEDS: postgres

  temporal-ui:
    image: temporalio/ui:2.32.0
    container_name: omnivara-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000

  # ============================================================
  # NestJS API
  # ============================================================
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: omnivara-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://omnivara:omnivara@postgres:5432/omnivara_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-32chars}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AI_SERVICE_URL: http://ai:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-omnivara-dev}
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # FastAPI AI Microservice
  # ============================================================
  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: omnivara-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://omnivara:omnivara@postgres:5432/omnivara_dev
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-32chars}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================================
  # Next.js Web App
  # ============================================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: omnivara-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_AI_URL: http://localhost:8000
      NODE_ENV: production

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  minio_data:
  clickhouse_data:
  opensearch_data:
